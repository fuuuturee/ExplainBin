name: Bug report
description: Report a crash, incorrect result or parser problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Do not upload live malware or sensitive binaries.**
        Use synthetic files, hashes or a minimal structural description instead.
        Security vulnerabilities should be reported privately as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: ExplainBin version or commit
      placeholder: "1.0.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - PE parser / core
        - Findings engine
        - Signature verification
        - GUI
        - CLI
        - Reports (JSON/HTML/text)
        - Build system
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: How can the issue be reproduced? Prefer a synthetic fixture or the exact CLI command.
      placeholder: |
        1. Build with ...
        2. Run explainbin-cli sample.exe --json report.json
        3. Observe ...
    validations:
      required: true
  - type: input
    id: file-info
    attributes:
      label: Sample metadata (if relevant)
      description: SHA-256, file type and size. Do not attach malware.
      placeholder: "SHA-256: ..., PE32+ x64 DLL, 1.2 MiB"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, compiler, CMake version, Qt version, generator.
      placeholder: |
        Windows 11 23H2
        MSVC 19.40 / MinGW GCC 14
        CMake 3.30, Ninja 1.12
        Qt 6.8.0
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: Paste relevant parser diagnostics, exit code or crash output.
      render: text
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I did not attach live malware or sensitive files.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
